name: Fader
options:
  bundleIdPrefix: com.lokasta
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.7.1"
    CURRENT_PROJECT_VERSION: "11"
targets:
  Fader:
    type: application
    platform: macOS
    sources: [Fader]
    dependencies:
      - target: FaderControls
        embed: true
    info:
      path: Fader/Info.plist
      properties:
        CFBundleDisplayName: "Lokasta's Fader"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Lokasta. MIT License."
        CFBundleURLTypes:
          - CFBundleURLName: com.lokasta.fader
            CFBundleURLSchemes: [fader]
        NSMicrophoneUsageDescription: "Fader shows your microphone's level while its panel is open. Nothing is recorded."
        NSAudioCaptureUsageDescription: "Fader needs access to each app's audio to control its volume individually. Nothing is recorded or leaves your Mac."
        NSAppleEventsUsageDescription: "Fader controls the volume of playing audio and video in Chrome tabs. Tab information stays on your Mac."
    entitlements:
      path: Fader/Fader.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lokasta.fader
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
  FaderControls:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources: [FaderControls]
    info:
      path: FaderControls/Info.plist
      properties:
        CFBundleDisplayName: Fader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FaderControls/FaderControls.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lokasta.fader.controls
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  FaderTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FaderTests]
    dependencies:
      - target: Fader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lokasta.fader.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Fader.app/Contents/MacOS/Fader
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Fader:
    build:
      targets:
        Fader: all
        FaderTests: [test]
    test:
      targets: [FaderTests]
